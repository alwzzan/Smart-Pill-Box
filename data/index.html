<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>صندوق الدواء الذكي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f0f4f8;color:#1e293b;line-height:1.5;min-height:100vh}
.hdr{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:1rem;display:flex;justify-content:space-between;align-items:center}
.hdr h1{font-size:1.1rem;font-weight:600}
.badge{padding:.35rem .75rem;border-radius:20px;font-size:.75rem;font-weight:600}
.badge.ok{background:#dcfce7;color:#16a34a}
.badge.err{background:#fee2e2;color:#dc2626}
.main{padding:1rem;max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-h{padding:1rem;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.card-b{padding:1rem}
.time-lg{font-size:2.8rem;font-weight:700;text-align:center;color:#2563eb;letter-spacing:1px}
.date-sm{text-align:center;color:#64748b;margin-top:.25rem}
.next{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff}
.next .card-h{border-color:rgba(255,255,255,.2);color:#fff}
.next-time{font-size:1.8rem;font-weight:700;text-align:center}
.next-cd{text-align:center;opacity:.9;margin-top:.25rem}
.dose{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;background:#f8fafc;border-radius:8px;margin-bottom:.5rem}
.dose.taken{background:#dcfce7}
.dose.taken .d-time{color:#16a34a;text-decoration:line-through}
.d-time{font-weight:600;font-size:1.1rem}
.d-st{font-size:.75rem;color:#64748b}
.row{display:flex;gap:.5rem;margin-bottom:.75rem}
.row>*{flex:1}
label{display:block;font-size:.8rem;color:#64748b;margin-bottom:.25rem}
select,input{width:100%;padding:.6rem;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;background:#fff}
select:focus,input:focus{outline:none;border-color:#2563eb}
.btn{display:inline-block;padding:.7rem 1.2rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-align:center;transition:opacity .2s}
.btn:active{opacity:.8}
.btn-p{background:#2563eb;color:#fff}
.btn-o{background:transparent;border:2px solid #2563eb;color:#2563eb}
.btn-d{background:#fee2e2;color:#dc2626;padding:.5rem .75rem}
.btn-s{background:#64748b;color:#fff;padding:.4rem .8rem;font-size:.8rem}
.btn-u{background:#f59e0b;color:#fff;padding:.4rem .8rem;font-size:.8rem}
.w100{width:100%}
.mb1{margin-bottom:1rem}
.hidden{display:none!important}
.edit-lock{opacity:.4;pointer-events:none}
.setting{display:flex;justify-content:space-between;align-items:center;padding:.75rem 0}
.setting+.setting{border-top:1px solid #e2e8f0}
.setting-t{font-weight:500}
.setting-d{font-size:.75rem;color:#64748b}
.toggle{position:relative;width:50px;height:28px}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:28px;transition:.3s}
.toggle span:before{content:"";position:absolute;height:22px;width:22px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+span{background:#2563eb}
.toggle input:checked+span:before{transform:translateX(22px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-c{background:#fff;border-radius:12px;width:100%;max-width:360px}
.modal-h{padding:1rem;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:1rem}
.modal-b{padding:1rem}
.modal-f{padding:1rem;border-top:1px solid #e2e8f0;display:flex;gap:.5rem;justify-content:flex-end}
.close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#64748b}
.toast{position:fixed;bottom:1rem;left:1rem;right:1rem;padding:.75rem 1rem;border-radius:8px;color:#fff;font-weight:500;z-index:200;text-align:center}
.toast.ok{background:#16a34a}
.toast.err{background:#dc2626}
.empty{text-align:center;color:#64748b;padding:2rem}
hr{border:none;border-top:1px solid #e2e8f0;margin:1rem 0}
</style>
</head>
<body>
<div class="hdr">
<h1>💊 صندوق الدواء الذكي</h1>
<span id="conn" class="badge err">غير متصل</span>
</div>
<div class="main">
<div class="card">
<div class="card-h"><span>⏰ الوقت والتاريخ</span><button id="unlockBtn" class="btn btn-s" onclick="toggleLock()">🔒 تعديل</button></div>
<div class="card-b">
<div class="time-lg" id="time">--:--</div>
<div class="date-sm" id="date">--/--/----</div>
<div id="editSec" class="edit-lock" style="margin-top:1rem">
<div class="row">
<div><label>الساعة</label><select id="eH"></select></div>
<div><label>الدقيقة</label><select id="eM"></select></div>
<div><label>ص/م</label><select id="eP"><option value="0">ص</option><option value="1">م</option></select></div>
</div>
<button class="btn btn-p w100 mb1" onclick="saveTime()">حفظ الوقت</button>
<hr>
<div class="row">
<div><label>اليوم</label><select id="eD"></select></div>
<div><label>الشهر</label><select id="eMo"></select></div>
<div><label>السنة</label><select id="eY"></select></div>
</div>
<button class="btn btn-p w100" onclick="saveDate()">حفظ التاريخ</button>
</div>
</div>
</div>
<div class="card next">
<div class="card-h">⏳ الجرعة القادمة</div>
<div class="card-b">
<div class="next-time" id="nextT">--:--</div>
<div class="next-cd" id="nextC">-- دقيقة</div>
<div style="text-align:center;margin-top:.5rem"><span id="prog">0/0</span> جرعات</div>
</div>
</div>
<div class="card">
<div class="card-h"><span>💊 الجرعات</span><button class="btn btn-o" style="padding:.4rem .8rem;font-size:.8rem" onclick="openModal()">+ إضافة</button></div>
<div class="card-b" id="doseList"><div class="empty">جاري التحميل...</div></div>
</div>
<div class="card">
<div class="card-h">⚙️ الإعدادات</div>
<div class="card-b">
<div class="setting">
<div><div class="setting-t">🔔 المنبه</div><div class="setting-d">تفعيل صوت التنبيه</div></div>
<label class="toggle"><input type="checkbox" id="alarmTog" onchange="setAlarm()"><span></span></label>
</div>
<div class="setting">
<div><div class="setting-t">🔄 تحديث تلقائي</div><div class="setting-d">كل 5 ثوان</div></div>
<label class="toggle"><input type="checkbox" id="autoTog" checked onchange="toggleAuto()"><span></span></label>
</div>
</div>
</div>
<button class="btn btn-o w100" onclick="load()">🔄 تحديث</button>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
<div class="modal-c" onclick="event.stopPropagation()">
<div class="modal-h"><h3>إضافة جرعة</h3><button class="close" onclick="closeModal()">×</button></div>
<div class="modal-b">
<div class="row">
<div><label>الساعة</label><select id="nH"></select></div>
<div><label>الدقيقة</label><select id="nM"></select></div>
<div><label>ص/م</label><select id="nP"><option value="0">ص</option><option value="1">م</option></select></div>
</div>
</div>
<div class="modal-f"><button class="btn btn-o" onclick="closeModal()">إلغاء</button><button class="btn btn-p" onclick="addDose()">إضافة</button></div>
</div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
var autoInt=null,locked=true,doses=[];
function $(id){return document.getElementById(id)}
function pop(sel,s,e){for(var i=s;i<=e;i++){var o=document.createElement("option");o.value=i;o.textContent=i<10?"0"+i:i;sel.appendChild(o)}}
pop($("eH"),1,12);pop($("eM"),0,59);pop($("eD"),1,31);pop($("eMo"),1,12);pop($("eY"),2024,2050);
pop($("nH"),1,12);pop($("nM"),0,59);
function toast(m,ok){var t=$("toast");t.textContent=m;t.className="toast "+(ok?"ok":"err");setTimeout(function(){t.className="toast hidden"},2500)}
function conn(ok){$("conn").className="badge "+(ok?"ok":"err");$("conn").textContent=ok?"✓ متصل":"✕ غير متصل"}
async function load(){
try{
var r=await fetch("/api/status");if(!r.ok)throw 0;
var d=await r.json();
$("time").textContent=d.time.hour+":"+(d.time.minute<10?"0":"")+d.time.minute+" "+(d.time.isPM?"م":"ص");
$("date").textContent=(d.date.day<10?"0":"")+d.date.day+"/"+(d.date.month<10?"0":"")+d.date.month+"/"+d.date.year;
$("eH").value=d.time.hour;$("eM").value=d.time.minute;$("eP").value=d.time.isPM?"1":"0";
$("eD").value=d.date.day;$("eMo").value=d.date.month;$("eY").value=d.date.year;
$("prog").textContent=d.dosesTaken+"/"+d.doseCount;
$("alarmTog").checked=d.alarmEnabled;
if(d.minutesToNextDose>=0){
var h=Math.floor(d.minutesToNextDose/60),m=d.minutesToNextDose%60;
$("nextC").textContent=h>0?(h+" ساعة "+m+" دقيقة"):(m+" دقيقة");
}else{$("nextT").textContent="--:--";$("nextC").textContent="لا توجد جرعات"}
locked=!d.timeEditUnlocked;updLock();
conn(true);
}catch(e){conn(false)}
try{
var r2=await fetch("/api/doses");if(!r2.ok)throw 0;
var dd=await r2.json();doses=dd.doses||[];
if(doses.length==0){$("doseList").innerHTML="<div class=\"empty\">لا توجد جرعات</div>";$("nextT").textContent="--:--";return}
var h="";
for(var i=0;i<doses.length;i++){
var ds=doses[i],p=ds.isPM?"م":"ص",mn=ds.minute<10?"0"+ds.minute:ds.minute;
var st=ds.taken?"✓ تم":(ds.enabled?"انتظار":"معطلة");
h+="<div class=\"dose"+(ds.taken?" taken":"")+"\"><div><div class=\"d-time\">"+ds.hour+":"+mn+" "+p+"</div><div class=\"d-st\">"+st+"</div></div><button class=\"btn btn-d\" onclick=\"delDose("+i+")\">🗑️</button></div>";
if(!ds.taken&&ds.enabled&&$("nextT").textContent=="--:--"){$("nextT").textContent=ds.hour+":"+mn+" "+p}
}
$("doseList").innerHTML=h;
}catch(e){}}
function updLock(){$("editSec").className=locked?"edit-lock":"";$("unlockBtn").textContent=locked?"🔒 تعديل":"🔓 قفل";$("unlockBtn").className="btn "+(locked?"btn-s":"btn-u")}
async function toggleLock(){
try{var r=await fetch("/api/unlock-time",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({unlock:locked})});
if(!r.ok)throw 0;locked=!locked;updLock();toast(locked?"تم القفل":"تم الفتح",true)}catch(e){toast("خطأ",false)}}
async function saveTime(){
try{var r=await fetch("/api/time",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hour:+$("eH").value,minute:+$("eM").value,isPM:$("eP").value=="1"})});
if(!r.ok){var e=await r.json();throw e.error||"fail"}toast("تم الحفظ",true);load()}catch(e){toast(e||"خطأ",false)}}
async function saveDate(){
try{var r=await fetch("/api/date",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({day:+$("eD").value,month:+$("eMo").value,year:+$("eY").value})});
if(!r.ok){var e=await r.json();throw e.error||"fail"}toast("تم الحفظ",true);load()}catch(e){toast(e||"خطأ",false)}}
function openModal(){$("nH").value=8;$("nM").value=0;$("nP").value="0";$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
async function addDose(){
try{var r=await fetch("/api/dose",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hour:+$("nH").value,minute:+$("nM").value,isPM:$("nP").value=="1"})});
if(!r.ok){var e=await r.json();throw e.error||"fail"}closeModal();toast("تمت الإضافة",true);load()}catch(e){toast(e||"خطأ",false);closeModal()}}
async function delDose(i){if(!confirm("حذف الجرعة؟"))return;
try{var r=await fetch("/api/dose?id="+i,{method:"DELETE"});if(!r.ok)throw 0;toast("تم الحذف",true);load()}catch(e){toast("خطأ",false)}}
async function setAlarm(){
try{var r=await fetch("/api/alarm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:$("alarmTog").checked})});
if(!r.ok)throw 0}catch(e){$("alarmTog").checked=!$("alarmTog").checked;toast("خطأ",false)}}
function toggleAuto(){if($("autoTog").checked){if(!autoInt)autoInt=setInterval(load,5000)}else{if(autoInt){clearInterval(autoInt);autoInt=null}}}
load();autoInt=setInterval(load,5000);
</script>
</body>
</html>
